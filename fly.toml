app = "westcapital-dispatch"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  DATABASE_URL = "file:/data/dispatch.db"

[[mounts]]
  source = "dispatch_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "get"
    path = "/api/agents"
